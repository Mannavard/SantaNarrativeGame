<div id="art">
  <div id="imgs"><img id="imgA" alt=""></div>
  <canvas id="fx"></canvas>
  <canvas id="fxHi"></canvas>
  <canvas id="clk"></canvas>
  <div id="giftLayer"><div id="giftSh"></div>
  <div id="gift" role="button" tabindex="0" aria-label="Open the gift"><img id="giftBody" alt=""><div id="heartWrap"><img id="heart" alt=""></div><img id="giftLid" alt=""></div></div>
  <div id="giftHint">TAP THE BOX</div>
</div>
<div id="flash"></div>
<div id="crt"></div>

<nav id="stepper" aria-label="Journey progress">
  <ol id="steps"></ol>
  <div id="steplbl">THE ROAD HASN'T BEGUN</div>
</nav>

<div id="corner">
  <button id="mute" type="button" aria-pressed="true" aria-label="Music on / off">
    <img class="w" src="img/ui/sound-on.png" alt="" aria-hidden="true">
    <img class="x" src="img/ui/sound-off.png" alt="" aria-hidden="true">
  </button>
  <button id="findsBtn" type="button" aria-label="Findings">
    <img src="img/ui/findings.png" alt="" aria-hidden="true">
    <span class="n" id="findsN"></span>
  </button>
</div>

<div id="finds" role="dialog" aria-modal="true" aria-labelledby="findsH">
  <div class="fbox">
    <h2 id="findsH">FINDINGS</h2>
    <div class="fcount" id="findsCount"></div>
    <div id="findsGrid"></div>
    <button id="findsClose" class="pxbtn" type="button">CLOSE</button>
  </div>
</div>
<div id="findFly" aria-hidden="true"><div class="fwrap"><div class="fburst"></div></div><div class="fcap"><div class="k" id="flyK"></div><div class="v" id="flyV"></div></div></div>
<div class="sr" id="srFind" aria-live="polite"></div>

<div id="clockUI"><button id="clockBtn" type="button" aria-label="Switch clock mode"></button></div>

<div id="dialog" role="region" aria-label="Dialogue">
  <div id="tag"></div>
  <div id="text"></div>
  <div id="choices"></div>
  <div id="next"></div>
</div>
<div id="quiet" aria-label="Quiet moment">
  <div id="qQ"></div><div id="qS"></div><div id="qCue"></div>
  <div class="qbtns"><button id="qReady" class="pxbtn" type="button"></button><button id="qMore" class="pxbtn" type="button"></button></div>
</div>
<div class="sr" id="sr" aria-live="polite"></div>

<div id="end"><h2 id="endH">THE END?</h2><button id="retry" type="button">CHANGE YOUR MIND</button></div>
<button id="remind" class="pxbtn" type="button">REMIND ME TO COME BACK</button>
<div id="card"><canvas id="cardCv" width="900" height="1260"></canvas>
  <div class="row"><button id="cardSave" class="pxbtn" type="button">SAVE THE CARD</button><button id="cardClose" class="pxbtn" type="button">CLOSE</button></div>
  <a id="cardFeedback" class="pxbtn" href="#" target="_blank" rel="noopener" hidden>TELL THE AUTHOR WHAT YOU THOUGHT</a></div>

<div id="gate" class="pick">
  <div id="langView">
    <div class="langs"><button type="button" data-l="ru">РУССКИЙ</button><button type="button" data-l="ro">ROMÂNĂ</button><button type="button" data-l="en">ENGLISH</button></div>
  </div>
  <div id="beginView" role="button" tabindex="0" aria-label="Begin">
    <div class="a" id="gateA">find a quiet corner<br>and take your time</div>
    <div class="b" id="gateB">[ TAP TO BEGIN ]</div>
  </div>
</div>
